[package]
name = "rust-store-api"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
surrealdb = { version = "3.3.0", features = ["kv-surrealkv"] }
tokio = { version = "1.53.2", features = ["full"] }
validator = { version = "0.21.0", features = ["derive"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = "0.5.3"
